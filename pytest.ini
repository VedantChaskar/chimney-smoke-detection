[pytest]
testpaths =
    physics_methods/temporal_reference/tests
    physics_methods/gemini_inpainting/tests
    physics_methods/smokescreen/tests
    physics_methods/smoke_opacity/tests
    physics_methods/vitmatte/tests
# importlib mode avoids module name collisions when multiple test dirs
# contain files with the same name (e.g. temporal_reference/tests/test_opacity.py
# and gemini_inpainting/tests/test_opacity.py)
addopts = -v --tb=short --import-mode=importlib
